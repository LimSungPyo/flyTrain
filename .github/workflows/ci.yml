name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions 탭에서 수동 실행("Run workflow" 버튼)

jobs:
  # ─────────────── 백엔드 (pytest) ───────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back_end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back_end/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=app --cov=brain --cov=games --cov-report=term-missing

  # ─────────────── 프론트 (vitest + build) ───────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front_end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front_end/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
